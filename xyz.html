<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yupikand Estates</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@300;400;500&display=swap');

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{
    height:100%;
    background:#000;
    font-family:'Inter',sans-serif;
    overflow-x:hidden;
  }

  /* ============================================================
     PRELOADER — solid black, single circular emblem, 3 loading dots
     Exactly mirrors the Royal Enfield reference: no photos, no
     background pattern, no progress bar. Just badge + dots on black,
     then the whole thing fades to reveal the real page underneath.
  ============================================================ */
  #preloader{
    position:fixed;
    inset:0;
    z-index:9999;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    transition:opacity .8s ease;
  }
  #preloader.hide{
    opacity:0;
    pointer-events:none;
  }

  /* ---- circular emblem badge ---- */
  .badge{
    width:104px;
    height:104px;
    margin-bottom:18px;
  }
  .badge .ring-outer{
    fill:none;
    stroke:#f5f5f2;
    stroke-width:1.4;
  }
  .badge .ring-inner{
    fill:none;
    stroke:#f5f5f2;
    stroke-width:.7;
  }
  .badge text{
    fill:#f5f5f2;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:6.6px;
    letter-spacing:1.6px;
  }
  .badge .sep{
    fill:#f5f5f2;
  }
  .badge .art-slide{
    opacity:0;
    transform:scale(.92);
    transform-origin:60px 60px;
    transition:opacity .6s ease, transform .6s ease;
  }
  .badge .art-slide.active{
    opacity:1;
    transform:scale(1);
  }
  .badge .art-slide path,
  .badge .art-slide rect,
  .badge .art-slide circle,
  .badge .art-slide line{
    stroke:#f5f5f2;
  }
  .badge .art-slide .fill{
    fill:#f5f5f2;
    stroke:none;
  }
  .badge .art-slide text{
    fill:#f5f5f2;
    font-weight:600;
    letter-spacing:2px;
  }

  /* ---- 6 loading dots — one per slide, active dot advances with the carousel ---- */
  .loader-dots{
    display:flex;
    gap:7px;
  }
  .loader-dots span{
    width:5px;
    height:5px;
    border-radius:50%;
    background:#f5f5f2;
    opacity:.25;
    transition:opacity .4s ease, transform .4s ease, background .4s ease;
  }
  .loader-dots span.active{
    opacity:1;
    background:#ffffff;
    transform:scale(1.4);
  }

  /* ============================================================
     ACTUAL SITE CONTENT — replace with your real homepage markup
  ============================================================ */
  #page{
    min-height:100%;
    background:#0b0d10;
    color:#f6f4ef;
  }
  .nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 20px;
    background:#111316;
  }
  .nav .logo{
    font-family:'Playfair Display', serif;
    font-weight:600;
    font-size:18px;
    letter-spacing:1px;
  }
  .nav .links{
    display:flex;
    gap:18px;
    font-size:13px;
    color:#cfcdc7;
  }
  .hero{
    position:relative;
    height:60vh;
    min-height:320px;
    background:
      linear-gradient(180deg, rgba(0,0,0,.15) 0%, rgba(0,0,0,.75) 100%),
      url('https://picsum.photos/id/1040/1200/900') center/cover no-repeat;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    padding-bottom:36px;
    text-align:center;
  }
  .hero h1{
    font-family:'Playfair Display', serif;
    font-weight:600;
    font-size:clamp(22px,4vw,30px);
    margin-bottom:14px;
  }
  .hero button{
    background:#b3452e;
    color:#fff;
    border:none;
    padding:10px 22px;
    font-size:13px;
    letter-spacing:.5px;
    border-radius:2px;
    cursor:pointer;
  }
  .hero-row{
    display:flex;
    height:40vh;
    min-height:220px;
  }
  .hero-row .hero{ flex:1; height:100%; min-height:0; }
</style>
</head>
<body>

  <!-- PRELOADER -->
  <div id="preloader">
    <svg class="badge" viewBox="0 0 120 120">
      <circle class="ring-outer" cx="60" cy="60" r="54"></circle>
      <circle class="ring-inner" cx="60" cy="60" r="47"></circle>

      <!-- top arc text -->
      <path id="arcTop" d="M13,60 A47,47 0 0,1 107,60" fill="none"></path>
      <text>

      </text>

      <!-- center: 6 villa-silhouette slides, cycled one by one -->

          <path d="M98 74 Q100 62 96 52 M96 52 Q92 54 94 46 M96 52 Q100 54 98 46" fill="none" stroke-width="1.3"/>
          <path class="fill" d="M34 74 L34 60 L64 60 L64 50 L86 50 L86 74 Z"/>

        <g class="art-slide">
          <path class="fill" d="M28 50 L60 34 L92 50 L86 50 L86 74 L34 74 L34 50 Z"/>
          <rect x="40" y="56" width="4" height="18" fill="#000"/>
          <rect x="50" y="56" width="4" height="18" fill="#000"/>

        <!-- 3: contemporary staircase villa -->
        <g class="art-slide">

          <path d="M100 74 Q102 60 97 48 M97 48 Q93 50 95 42 M97 48 Q101 50 99 42" fill="none" stroke-width="1.2"/>
          <path class="fill" d="M32 74 L32 56 L88 56 L88 74 Z"/>

          <rect x="58" y="42" width="4" height="8" class="fill"/>
          <path d="M40 64 A4 4 0 0 1 48 64" fill="none" stroke-width="1.1"/>
          <path d="M72 64 A4 4 0 0 1 80 64" fill="none" stroke-width="1.1"/>
        </g>

        <!-- 5: minimalist abstract black blocks -->
        <g class="art-slide">
          <path class="fill" d="M24 74 L24 58 L52 46 L52 74 Z"/>
          <path class="fill" d="M52 74 L52 52 L90 40 L90 74 Z"/>
          <path d="M52 52 L90 40" stroke-width="1.2" fill="none"/>
        </g>

        <!-- 6: minimalist outline villa (blueprint style) -->
        <g class="art-slide">
          <rect x="30" y="52" width="60" height="22" fill="none" stroke-width="1.3"/>
          <line x1="30" y1="60" x2="90" y2="60" stroke-width="1"/>
          <line x1="48" y1="52" x2="48" y2="74" stroke-width="1"/>
          <line x1="68" y1="52" x2="68" y2="74" stroke-width="1"/>
          <text x="60" y="86" text-anchor="middle" font-size="8" letter-spacing="2" style="font-family:'Playfair Display',serif;">VILLA</text>
        </g>

      </g>
    </svg>

    <div class="loader-dots" id="loaderDots">
      <span class="active"></span><span></span><span></span><span></span><span></span><span></span>
    </div>
  </div>

  <!-- ACTUAL SITE CONTENT GOES HERE -->
  <div id="page">
    <div class="nav">
      <div class="logo">Yupikand</div>
      <div class="links">Villas &nbsp; Amenities &nbsp; Gallery &nbsp; Contact</div>
    </div>

    <div class="hero">
      <h1>Sea View Villa</h1>
      <button>Know More &rsaquo;</button>
    </div>

    <div class="hero-row">
      <div class="hero" style="background-image:linear-gradient(180deg, rgba(0,0,0,.15) 0%, rgba(0,0,0,.75) 100%), url('https://picsum.photos/id/1067/800/600')"></div>
      <div class="hero" style="background-image:linear-gradient(180deg, rgba(0,0,0,.15) 0%, rgba(0,0,0,.75) 100%), url('https://picsum.photos/id/1080/800/600')"></div>
    </div>
  </div>

<script>
  (function(){
    var pre = document.getElementById('preloader');

    // -------- cycle the 6 villa-icon slides, one at a time, dots stay in sync --------
    (function runSlideCarousel(){
      var slides = document.querySelectorAll('#iconSlides .art-slide');
      var dots   = document.querySelectorAll('#loaderDots span');
      if (!slides.length) return;
      var idx = 0;
      setInterval(function(){
        slides[idx].classList.remove('active');
        dots[idx] && dots[idx].classList.remove('active');
        idx = (idx + 1) % slides.length;
        slides[idx].classList.add('active');
        dots[idx] && dots[idx].classList.add('active');
      }, 1500);
    })();

    // Simulated minimum loading time — replace with real asset-loading logic if needed
    var MIN_VISIBLE_MS = 9500; // gives all 6 slides a full turn (6 x 1.5s carousel)
    var start = Date.now();

    function finish(){
      pre.classList.add('hide');
      pre.addEventListener('transitionend', function(){ pre.remove(); }, { once:true });
    }

    window.addEventListener('load', function(){
      var elapsed = Date.now() - start;
      var wait = Math.max(0, MIN_VISIBLE_MS - elapsed);
      setTimeout(finish, wait);
    });

    // fallback in case 'load' never fires (e.g. slow/blocked assets)
    setTimeout(finish, 11000);
  })();
</script>

</body>
</html>
